<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>3D Mesh Viewer</title>
    <style>
        body { margin: 0; overflow: hidden; }
        canvas { display: block; }
    </style>
</head>
<body>

<!-- Three.js (старая версия с поддержкой OrbitControls) -->
<script src="https://cdn.jsdelivr.net/npm/three@0.124.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.124.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.124.0/examples/js/loaders/GLTFLoader.js"></script>

<script>
    // === СЦЕНА ===
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xcccccc);

    // === КАМЕРА ===
    const camera = new THREE.PerspectiveCamera(
        60,
        window.innerWidth / window.innerHeight,
        0.01,
        5000
    );

    // === РЕНДЕРЕР ===
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // === ОСВЕЩЕНИЕ ===
    scene.add(new THREE.AmbientLight(0xffffff, 0.6));

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(10, 20, 10);
    scene.add(dirLight);

    // === УПРАВЛЕНИЕ КАМЕРОЙ ===
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    // === ФИЛЬТР МЕЛКИХ ОБЪЕКТОВ ===
    function filterSmallObjects(object3D, minVolume = 5) {
        object3D.traverse(child => {
            if (child.isMesh) {
                child.geometry.computeBoundingBox();
                const b = child.geometry.boundingBox;
                const volume = (b.max.x - b.min.x) * (b.max.y - b.min.y) * (b.max.z - b.min.z);
                if (volume < minVolume) child.visible = false;
            }
        });
    }

    // === ЗАГРУЗКА МОДЕЛИ ===
    const loader = new THREE.GLTFLoader();
    loader.load(
        "../data/dense/meshed-poisson.glb",
        function (gltf) {
            const model = gltf.scene;

            // Поворот модели (если нужно)
            model.rotation.x = Math.PI;

            // Фильтрация шумов
            filterSmallObjects(model, 0.005);

            scene.add(model);

            // === АВТО-ЦЕНТРОВКА И МАСШТАБ ===
            const box = new THREE.Box3().setFromObject(model);
            const size = new THREE.Vector3();
            const center = new THREE.Vector3();
            box.getSize(size);
            box.getCenter(center);

            // Сдвигаем модель в центр сцены
            model.position.x += (model.position.x - center.x);
            model.position.y += (model.position.y - center.y);
            model.position.z += (model.position.z - center.z);

            // Вычисляем оптимальную дистанцию камеры
            const maxDim = Math.max(size.x, size.y, size.z);
            const fov = camera.fov * (Math.PI / 180);
            const cameraDist = maxDim / Math.tan(fov / 2);

            camera.position.set(0, maxDim * 0.5, cameraDist * 1.3);
            camera.lookAt(0, 0, 0);

            // Настройки OrbitControls
            controls.target.set(0, 0, 0);
            controls.maxDistance = cameraDist * 3;
            controls.minDistance = maxDim * 0.05;
        },
        undefined,
        function (error) {
            console.error("Ошибка загрузки модели:", error);
        }
    );

    // === АНИМАЦИЯ ===
    function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
    }
    animate();

    // === РЕСАЙЗ ===
    window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>

</body>
</html>
